# Render Blueprint — Backend API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: osint-attack-path-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OSINT_MODE
        value: demo
      - key: FRONTEND_URL
        # Update this to your GitHub Pages URL (sub-path included)
        value: https://sahilsingh0532.github.io
      - key: DATABASE_URL
        # Leave unset to use the default SQLite DB bundled with the app.
        # Set to a postgresql+asyncpg:// URL to switch to PostgreSQL.
        value: ""
    plan: free
